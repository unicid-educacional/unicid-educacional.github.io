<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNICID - carteirinha digital</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="content" class="login-container">
        <img src="assets/images/cruzeiro-edu.svg" alt="Cruzeiro Edu" class="top-right-image">
        <h2 style="color: #032f5b;">Bem-vindo(a) a Área do Aluno</h2>
        <div class="form-group">
            <label for="login">Login:</label>
            <input type="text" id="login" placeholder="Seu RGM ou E-mail">
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" placeholder="senha">
        </div>
        <div class="error-message" id="error-message"></div>
        <button id="login-btn" onclick="checkLogin()">Entrar</button>
        <button id="forgot-password-btn" onclick="showAlert()">Esqueci minha senha</button>
    </div>

    <div id="card-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <img id="card-image" src="" alt="Carteirinha Digital">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
